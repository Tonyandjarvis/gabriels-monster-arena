<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Test - Gabriel's Monster Arena</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #2c3e50;
            color: white;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .test-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 20px 0;
            border-radius: 10px;
        }
        .test-result {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .test-pass {
            background: rgba(76, 175, 80, 0.3);
            border-left: 4px solid #4CAF50;
        }
        .test-fail {
            background: rgba(244, 67, 54, 0.3);
            border-left: 4px solid #f44336;
        }
        .test-info {
            background: rgba(33, 150, 243, 0.3);
            border-left: 4px solid #2196F3;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #45a049;
        }
        #console-output {
            background: #000;
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            height: 200px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>Simple Test - Gabriel's Monster Arena</h1>
        
        <div class="test-section">
            <h2>File Access Test</h2>
            <div id="test-results"></div>
            <button id="testFiles">Test File Access</button>
            <button id="testInline">Test Inline Code</button>
        </div>
        
        <div class="test-section">
            <h2>Console Output</h2>
            <div id="console-output"></div>
        </div>
    </div>

    <script>
        // Test framework
        class SimpleTestFramework {
            constructor() {
                this.results = [];
                this.originalConsoleLog = console.log;
                this.originalConsoleError = console.error;
                this.setupConsoleCapture();
                this.setupEventListeners();
            }

            setupConsoleCapture() {
                const consoleOutput = document.getElementById('console-output');
                
                console.log = (...args) => {
                    this.originalConsoleLog(...args);
                    consoleOutput.innerHTML += args.join(' ') + '\n';
                    consoleOutput.scrollTop = consoleOutput.scrollHeight;
                };
                
                console.error = (...args) => {
                    this.originalConsoleError(...args);
                    consoleOutput.innerHTML += '<span style="color: #f00;">ERROR: ' + args.join(' ') + '</span>\n';
                    consoleOutput.scrollTop = consoleOutput.scrollHeight;
                };
            }

            setupEventListeners() {
                document.getElementById('testFiles').addEventListener('click', () => this.testFileAccess());
                document.getElementById('testInline').addEventListener('click', () => this.testInlineCode());
            }

            addResult(testName, passed, message) {
                this.results.push({ testName, passed, message });
                this.updateResultsDisplay();
            }

            updateResultsDisplay() {
                const resultsDiv = document.getElementById('test-results');
                resultsDiv.innerHTML = '';
                
                this.results.forEach(result => {
                    const div = document.createElement('div');
                    div.className = `test-result ${result.passed ? 'test-pass' : 'test-fail'}`;
                    div.innerHTML = `<strong>${result.testName}:</strong> ${result.passed ? 'PASS' : 'FAIL'} - ${result.message}`;
                    resultsDiv.appendChild(div);
                });
            }

            async testFileAccess() {
                console.log('=== TESTING FILE ACCESS ===');
                this.results = [];
                
                const files = [
                    'js/engine/Component.js',
                    'js/engine/Entity.js',
                    'js/engine/System.js',
                    'js/components/PositionComponent.js',
                    'js/components/MonsterComponent.js',
                    'js/GameEngine.js'
                ];
                
                for (const file of files) {
                    try {
                        const response = await fetch(file);
                        if (response.ok) {
                            this.addResult(file, true, 'File accessible');
                            console.log(`${file}: ACCESSIBLE`);
                        } else {
                            this.addResult(file, false, `HTTP ${response.status}`);
                            console.log(`${file}: HTTP ${response.status}`);
                        }
                    } catch (error) {
                        this.addResult(file, false, `Error: ${error.message}`);
                        console.log(`${file}: ERROR - ${error.message}`);
                    }
                }
                
                console.log('=== FILE ACCESS TEST COMPLETE ===');
            }

            testInlineCode() {
                console.log('=== TESTING INLINE CODE ===');
                this.results = [];
                
                try {
                    // Test basic JavaScript functionality
                    this.addResult('JavaScript Basic', true, 'JavaScript is working');
                    
                    // Test if we can create basic objects
                    const testObj = { test: 'value' };
                    this.addResult('Object Creation', !!testObj, 'Objects can be created');
                    
                    // Test if we can create classes
                    class TestClass {
                        constructor() {
                            this.value = 'test';
                        }
                    }
                    const testInstance = new TestClass();
                    this.addResult('Class Creation', !!testInstance.value, 'Classes can be created');
                    
                    // Test if we can access DOM
                    const canvas = document.getElementById('test-results');
                    this.addResult('DOM Access', !!canvas, 'DOM elements accessible');
                    
                } catch (error) {
                    this.addResult('Inline Code Test', false, `Failed: ${error.message}`);
                    console.error('Inline code test failed:', error);
                }
                
                console.log('=== INLINE CODE TEST COMPLETE ===');
            }
        }

        // Initialize test framework when page loads
        document.addEventListener('DOMContentLoaded', () => {
            window.simpleTestFramework = new SimpleTestFramework();
            console.log('Simple Test Framework initialized. Click buttons to test.');
        });
    </script>
</body>
</html>
