<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Gabriel's Monster Arena</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameCanvas {
            border: 2px solid #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            background: #2c3e50;
            touch-action: none;
        }

        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: white;
        }

        #loadingScreen h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #loadingScreen p {
            font-size: 1.2em;
            margin-bottom: 30px;
        }

        #loadingBar {
            width: 300px;
            height: 20px;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        #loadingProgress {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.3s ease;
        }

        #startButton {
            padding: 15px 30px;
            font-size: 1.5em;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            min-width: 120px;
            min-height: 50px;
        }

        #startButton:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        #startButton:active {
            transform: translateY(0);
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            #loadingScreen h1 {
                font-size: 2em;
            }
            
            #loadingScreen p {
                font-size: 1em;
            }
            
            #loadingBar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="loadingScreen">
            <h1>🎮 Gabriel's Monster Arena</h1>
            <p>Defend your realm with powerful monsters!</p>
            <div id="loadingBar">
                <div id="loadingProgress"></div>
            </div>
            <button id="startButton">Start Game</button>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <script src="js/utils/ObjectPool.js"></script>
    <script src="js/engine/Entity.js"></script>
    <script src="js/engine/Component.js"></script>
    <script src="js/engine/System.js"></script>
    <script src="js/components/PositionComponent.js"></script>
    <script src="js/components/SpriteRenderer.js"></script>
    <script src="js/components/MonsterComponent.js"></script>
    <script src="js/components/EnemyComponent.js"></script>
    <script src="js/components/ProjectileComponent.js"></script>
    <script src="js/systems/PlacementSystem.js"></script>
    <script src="js/systems/CombatSystem.js"></script>
    <script src="js/systems/PathfindingSystem.js"></script>
    <script src="js/systems/WaveSystem.js"></script>
    <script src="js/systems/RenderSystem.js"></script>
    <script src="js/systems/UISystem.js"></script>
    <script src="js/systems/AudioSystem.js"></script>
    <script src="js/systems/ParticleSystem.js"></script>
    <script src="js/systems/TutorialSystem.js"></script>
    <script src="js/utils/PerformanceMonitor.js"></script>
    <script src="js/utils/SaveSystem.js"></script>
    <script src="js/GameEngine.js"></script>
    
    <!-- Script Load Verification -->
    <script>
    // Verify all required classes are loaded
    console.log('=== SCRIPT LOAD VERIFICATION ===');
    console.log('Entity:', typeof Entity !== 'undefined' ? '✅' : '❌');
    console.log('Component:', typeof Component !== 'undefined' ? '✅' : '❌');
    console.log('System:', typeof System !== 'undefined' ? '✅' : '❌');
    console.log('MonsterComponent:', typeof MonsterComponent !== 'undefined' ? '✅' : '❌');
    console.log('MonsterComponent.TYPES:', typeof MonsterComponent !== 'undefined' && MonsterComponent.TYPES ? '✅' : '❌');
    console.log('EnemyComponent:', typeof EnemyComponent !== 'undefined' ? '✅' : '❌');
    console.log('UISystem:', typeof UISystem !== 'undefined' ? '✅' : '❌');
    console.log('GameEngine:', typeof GameEngine !== 'undefined' ? '✅' : '❌');
    console.log('================================');
    </script>
    
    <script src="js/main.js"></script>
</body>
</html>
